<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
body{margin:0;padding:24px;background:var(--bg-0);font-family:var(--font-body);display:grid;grid-template-columns:repeat(8,1fr);gap:14px}
.icon{display:flex;flex-direction:column;align-items:center;gap:6px;color:#A5AEBC}
.icon svg{width:24px;height:24px;stroke-width:1.75}
.icon:hover{color:#ACDE40}
.name{font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
</style></head><body>
<div class="icon"><i data-lucide="layout-dashboard"></i><span class="name">dashboard</span></div>
<div class="icon"><i data-lucide="workflow"></i><span class="name">workflow</span></div>
<div class="icon"><i data-lucide="bot"></i><span class="name">bot</span></div>
<div class="icon"><i data-lucide="bar-chart-3"></i><span class="name">chart</span></div>
<div class="icon"><i data-lucide="users"></i><span class="name">users</span></div>
<div class="icon"><i data-lucide="check-circle-2"></i><span class="name">check</span></div>
<div class="icon"><i data-lucide="calendar"></i><span class="name">calendar</span></div>
<div class="icon"><i data-lucide="target"></i><span class="name">target</span></div>
<div class="icon"><i data-lucide="settings"></i><span class="name">settings</span></div>
<div class="icon"><i data-lucide="message-square"></i><span class="name">message</span></div>
<div class="icon"><i data-lucide="bell"></i><span class="name">bell</span></div>
<div class="icon"><i data-lucide="file-text"></i><span class="name">file</span></div>
<div class="icon"><i data-lucide="arrow-right"></i><span class="name">arrow-right</span></div>
<div class="icon"><i data-lucide="zap"></i><span class="name">zap</span></div>
<div class="icon"><i data-lucide="trending-up"></i><span class="name">trending</span></div>
<div class="icon"><i data-lucide="sparkles"></i><span class="name">sparkles</span></div>
<script>lucide.createIcons()</script>
</body></html>
