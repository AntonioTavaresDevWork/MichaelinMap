<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:var(--bg-0);font-family:var(--font-body);display:flex;flex-direction:column;gap:16px}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:60px;border-radius:10px;border:1px solid var(--border-1)}
.name{font-size:11px;font-weight:600;color:var(--fg-1)}
.hex{font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
h3{margin:0;font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--fg-2);letter-spacing:0.04em;text-transform:uppercase}
</style></head><body>
<h3>Ink · dark surfaces (default)</h3>
<div class="row">
  <div class="sw"><div class="chip" style="background:#0F141B"></div><div class="name">Ink 0</div><div class="hex">#0F141B</div></div>
  <div class="sw"><div class="chip" style="background:#1A222B"></div><div class="name">Ink 1</div><div class="hex">#1A222B</div></div>
  <div class="sw"><div class="chip" style="background:#222B36"></div><div class="name">Ink 2</div><div class="hex">#222B36</div></div>
  <div class="sw"><div class="chip" style="background:#29323B"></div><div class="name">Ink 3</div><div class="hex">#29323B</div></div>
  <div class="sw"><div class="chip" style="background:#3C4856"></div><div class="name">Ink 4</div><div class="hex">#3C4856</div></div>
  <div class="sw"><div class="chip" style="background:#55637A"></div><div class="name">Ink 5</div><div class="hex">#55637A</div></div>
</div>
<h3>Snow · light surfaces</h3>
<div class="row">
  <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="name">Snow 0</div><div class="hex">#FFFFFF</div></div>
  <div class="sw"><div class="chip" style="background:#FAFBFC"></div><div class="name">Snow 1</div><div class="hex">#FAFBFC</div></div>
  <div class="sw"><div class="chip" style="background:#F1F3F5"></div><div class="name">Snow 2</div><div class="hex">#F1F3F5</div></div>
  <div class="sw"><div class="chip" style="background:#E4E7EB"></div><div class="name">Snow 3</div><div class="hex">#E4E7EB</div></div>
  <div class="sw"><div class="chip" style="background:#C8CED6"></div><div class="name">Snow 4</div><div class="hex">#C8CED6</div></div>
  <div class="sw"><div class="chip" style="background:#9AA3B0"></div><div class="name">Snow 5</div><div class="hex">#9AA3B0</div></div>
</div>
</body></html>
