<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:var(--bg-0);font-family:var(--font-body);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase}
.lime{background:rgba(172,222,64,0.12);color:#ACDE40}
.info{background:rgba(76,154,255,0.12);color:#4C9AFF}
.warn{background:rgba(245,165,36,0.14);color:#F5A524}
.danger{background:rgba(229,72,77,0.14);color:#E5484D}
.neutral{background:#222B36;color:#A5AEBC;border:1px solid #29323B}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
</style></head><body>
<span class="badge lime"><span class="dot"></span>Ativo</span>
<span class="badge info">Em Revisão</span>
<span class="badge warn">Pendente</span>
<span class="badge danger">Atrasado</span>
<span class="badge neutral">Arquivado</span>
<span class="badge lime">AI-First</span>
<span class="badge lime">Power BI</span>
<span class="badge lime">SaaS</span>
</body></html>
