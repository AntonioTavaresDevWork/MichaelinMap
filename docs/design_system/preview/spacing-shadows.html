<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">

.sw{display:flex;flex-direction:column;gap:10px;align-items:center}
.box{width:140px;height:80px;background:#fff;border-radius:12px}

<div class="sw"><div class="box" style="box-shadow:0 1px 2px rgba(10,14,20,0.06),0 4px 12px rgba(10,14,20,0.04)"></div><div class="name">card</div><div class="val">light resting</div></div>
<div class="sw"><div class="box" style="box-shadow:0 12px 32px rgba(0,0,0,0.18),0 2px 8px rgba(0,0,0,0.08)"></div><div class="name">popover</div><div class="val">menus · modals</div></div>
<div class="sw"><div class="box" style="box-shadow:0 40px 80px rgba(0,0,0,0.22),0 0 0 1px rgba(0,0,0,0.04)"></div><div class="name">hero</div><div class="val">product mockups</div></div>
