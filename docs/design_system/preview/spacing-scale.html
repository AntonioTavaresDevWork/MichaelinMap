<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:var(--bg-0);font-family:var(--font-body);display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.box{background:#ACDE40;border-radius:4px}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:80px;flex-shrink:0}
.tok{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);margin-left:auto}
h3{margin:0;font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--fg-2);letter-spacing:0.04em;text-transform:uppercase}
</style></head><body>
<h3>Spacing · 4px grid</h3>
<div class="row"><div class="lbl">space-2</div><div class="box" style="width:4px;height:20px"></div><div class="tok">4px</div></div>
<div class="row"><div class="lbl">space-3</div><div class="box" style="width:8px;height:20px"></div><div class="tok">8px</div></div>
<div class="row"><div class="lbl">space-4</div><div class="box" style="width:12px;height:20px"></div><div class="tok">12px</div></div>
<div class="row"><div class="lbl">space-5</div><div class="box" style="width:16px;height:20px"></div><div class="tok">16px</div></div>
<div class="row"><div class="lbl">space-6</div><div class="box" style="width:24px;height:20px"></div><div class="tok">24px · default card padding</div></div>
<div class="row"><div class="lbl">space-7</div><div class="box" style="width:32px;height:20px"></div><div class="tok">32px</div></div>
<div class="row"><div class="lbl">space-8</div><div class="box" style="width:48px;height:20px"></div><div class="tok">48px</div></div>
<div class="row"><div class="lbl">space-9</div><div class="box" style="width:64px;height:20px"></div><div class="tok">64px · section mobile</div></div>
<div class="row"><div class="lbl">space-10</div><div class="box" style="width:96px;height:20px"></div><div class="tok">96px · section desktop</div></div>
</body></html>
