<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:var(--bg-0);font-family:var(--font-body);display:flex;flex-direction:column;gap:16px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:72px;border-radius:12px;border:1px solid var(--border-1)}
.name{font-size:12px;font-weight:600;color:var(--fg-1);letter-spacing:-0.01em}
.hex{font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
h3{margin:0;font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--fg-2);letter-spacing:0.04em;text-transform:uppercase}
</style></head><body>
<h3>Lime scale · brand accent</h3>
<div class="row">
  <div class="sw"><div class="chip" style="background:#F4FBE0"></div><div class="name">Lime 50</div><div class="hex">#F4FBE0</div></div>
  <div class="sw"><div class="chip" style="background:#E7F5C0"></div><div class="name">Lime 100</div><div class="hex">#E7F5C0</div></div>
  <div class="sw"><div class="chip" style="background:#D3EC8A"></div><div class="name">Lime 200</div><div class="hex">#D3EC8A</div></div>
  <div class="sw"><div class="chip" style="background:#BFE360"></div><div class="name">Lime 300</div><div class="hex">#BFE360</div></div>
  <div class="sw"><div class="chip" style="background:#ACDE40;box-shadow:0 0 0 2px var(--bg-0),0 0 0 3px #ACDE40"></div><div class="name">Lime 400 ★</div><div class="hex">#ACDE40</div></div>
</div>
<div class="row">
  <div class="sw"><div class="chip" style="background:#96C42C"></div><div class="name">Lime 500</div><div class="hex">#96C42C</div></div>
  <div class="sw"><div class="chip" style="background:#7BA31E"></div><div class="name">Lime 600</div><div class="hex">#7BA31E</div></div>
  <div class="sw"><div class="chip" style="background:#5E7D14"></div><div class="name">Lime 700</div><div class="hex">#5E7D14</div></div>
  <div class="sw"><div class="chip" style="background:#44590F"></div><div class="name">Lime 800</div><div class="hex">#44590F</div></div>
  <div class="sw"><div class="chip" style="background:#2D3B0A"></div><div class="name">Lime 900</div><div class="hex">#2D3B0A</div></div>
</div>
</body></html>
