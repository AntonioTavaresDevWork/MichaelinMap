<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:var(--bg-0);font-family:var(--font-body);display:grid;gap:16px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:60px;border-radius:10px}
.name{font-size:11px;font-weight:600;color:var(--fg-1)}
.hex{font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
h3{margin:0;font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--fg-2);letter-spacing:0.04em;text-transform:uppercase}
.demo{display:flex;gap:4px;padding:12px;background:var(--bg-1);border-radius:12px;align-items:flex-end;height:110px;border:1px solid var(--border-1)}
.bar{flex:1;border-radius:4px 4px 0 0}
</style></head><body>
<h3>Chart series · Power BI / Dashboards</h3>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#ACDE40"></div><div class="name">Series 1</div><div class="hex">#ACDE40</div></div>
  <div class="sw"><div class="chip" style="background:#4C9AFF"></div><div class="name">Series 2</div><div class="hex">#4C9AFF</div></div>
  <div class="sw"><div class="chip" style="background:#F5A524"></div><div class="name">Series 3</div><div class="hex">#F5A524</div></div>
  <div class="sw"><div class="chip" style="background:#E5484D"></div><div class="name">Series 4</div><div class="hex">#E5484D</div></div>
  <div class="sw"><div class="chip" style="background:#9B8AFB"></div><div class="name">Series 5</div><div class="hex">#9B8AFB</div></div>
  <div class="sw"><div class="chip" style="background:#26C6DA"></div><div class="name">Series 6</div><div class="hex">#26C6DA</div></div>
</div>
<div class="demo">
  <div class="bar" style="background:#ACDE40;height:80%"></div>
  <div class="bar" style="background:#4C9AFF;height:55%"></div>
  <div class="bar" style="background:#F5A524;height:40%"></div>
  <div class="bar" style="background:#E5484D;height:65%"></div>
  <div class="bar" style="background:#9B8AFB;height:30%"></div>
  <div class="bar" style="background:#26C6DA;height:50%"></div>
  <div class="bar" style="background:#ACDE40;height:70%"></div>
  <div class="bar" style="background:#4C9AFF;height:45%"></div>
  <div class="bar" style="background:#F5A524;height:85%"></div>
  <div class="bar" style="background:#E5484D;height:35%"></div>
</div>
</body></html>
