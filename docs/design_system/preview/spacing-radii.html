<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:var(--bg-0);font-family:var(--font-body);display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.sw{display:flex;flex-direction:column;gap:8px;align-items:center}
.box{width:70px;height:70px;background:#ACDE40;border:1px solid transparent}
.name{font-size:11px;font-weight:600;color:var(--fg-1)}
.val{font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
</style></head><body>
<div class="sw"><div class="box" style="border-radius:4px"></div><div class="name">sm</div><div class="val">4px</div></div>
<div class="sw"><div class="box" style="border-radius:8px"></div><div class="name">md</div><div class="val">8px</div></div>
<div class="sw"><div class="box" style="border-radius:12px"></div><div class="name">lg · card</div><div class="val">12px</div></div>
<div class="sw"><div class="box" style="border-radius:16px"></div><div class="name">xl</div><div class="val">16px</div></div>
<div class="sw"><div class="box" style="border-radius:24px"></div><div class="name">2xl</div><div class="val">24px</div></div>
<div class="sw"><div class="box" style="border-radius:999px"></div><div class="name">pill</div><div class="val">999px</div></div>
</body></html>
