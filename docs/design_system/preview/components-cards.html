<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:var(--bg-0);font-family:var(--font-body);display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#1A222B;border:1px solid #29323B;border-radius:12px;padding:20px;transition:border 200ms}
.card:hover{border-color:#3C4856}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#ACDE40;margin:0 0 8px}
.title{font-family:var(--font-display);font-size:18px;font-weight:700;color:#F4F6F8;margin:0 0 6px;letter-spacing:-0.01em}
.desc{font-size:13px;line-height:20px;color:#A5AEBC;margin:0}
.stat{display:flex;align-items:baseline;gap:4px}
.num{font-family:var(--font-display);font-size:42px;font-weight:800;color:#ACDE40;line-height:1;letter-spacing:-0.02em}
.unit{font-family:var(--font-display);font-size:22px;font-weight:700;color:#ACDE40}
.caption{font-size:12px;color:#A5AEBC;margin-top:6px}
</style></head><body>
<div class="card">
  <p class="eyebrow">A Solução</p>
  <h3 class="title">Workflow Estruturado</h3>
  <p class="desc">Automatiza todo o fluxo: coordenação → família → terapeutas. Prazos, notificações e histórico completo.</p>
</div>
<div class="card">
  <div class="stat"><span class="num">70</span><span class="unit">%</span></div>
  <div class="caption">Redução de tempo administrativo</div>
</div>
</body></html>
