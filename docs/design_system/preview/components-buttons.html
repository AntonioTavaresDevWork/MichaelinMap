<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:var(--bg-0);font-family:var(--font-body);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:8px;font-weight:600;font-size:15px;cursor:pointer;border:none;transition:all 150ms cubic-bezier(0.16,1,0.3,1);font-family:var(--font-body)}
.primary{background:#ACDE40;color:#0F141B}
.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.ghost{background:transparent;color:#F4F6F8;border:1px solid #29323B}
.ghost:hover{border-color:#3C4856;background:#1A222B}
.link{background:transparent;color:#F4F6F8;padding:0;height:auto}
.link:hover{color:#ACDE40;text-decoration:underline;text-underline-offset:3px}
.sm{height:36px;padding:0 14px;font-size:13px;border-radius:6px}
.icon{width:16px;height:16px;stroke-width:2;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<button class="btn primary">Agendar Demonstração <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
<button class="btn ghost">Ver como funciona</button>
<button class="btn link">Fale conosco →</button>
<button class="btn primary sm">Entrar</button>
<button class="btn ghost sm">Cancelar</button>
</body></html>
