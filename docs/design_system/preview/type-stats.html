<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:var(--bg-0);font-family:var(--font-body);display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{background:var(--bg-1);border:1px solid var(--border-1);border-radius:12px;padding:20px}
.num{font-family:var(--font-display);font-weight:800;font-size:56px;line-height:1;letter-spacing:-0.02em;color:#ACDE40}
.lbl{font-size:12px;color:var(--fg-2);margin-top:8px;line-height:1.4}
</style></head><body>
<div class="stat"><div class="num">70<span style="font-size:32px">%</span></div><div class="lbl">Redução de tempo administrativo</div></div>
<div class="stat"><div class="num">1,3<span style="font-size:32px">M</span></div><div class="lbl">Alunos com necessidades especiais no Brasil</div></div>
<div class="stat"><div class="num">92<span style="font-size:32px">%</span></div><div class="lbl">PEIs executados até o final</div></div>
<div class="stat"><div class="num">100<span style="font-size:32px">%</span></div><div class="lbl">Conformidade com LDB</div></div>
</body></html>
